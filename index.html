<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Site header with the app name and tagline -->
  <header>
    <h1>QuickNotes</h1>
    <p>Jot down your thoughts, ideas and to-dos</p>
  </header>

  <main>
    <!-- Section for creating a new note -->
    <section id="add-note-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <!-- Label linked to the note text input -->
        <label for="note-input">Note</label>
        <input type="text" id="note-input" name="note" placeholder="Write your note here...">
        <!-- Category dropdown with three options -->
        <label for="note-category">Category</label>
        <select id="note-category" name="category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <!-- Empty paragraph for validation errors -->
      <p id="error-message"></p>
    </section>

    <!-- Section listing existing notes -->
    <section id="notes-section">
      <h2>Your notes</h2>
      <input type="search" id="search-input" placeholder="Search notes...">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <!-- Page footer -->
  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
